name: Deploy a Vercel

# Despliegue automático a producción en cada push a main.
# Requiere los secretos: VERCEL_TOKEN, VERCEL_ORG_ID, VERCEL_PROJECT_ID
# (ya configurados en Settings → Secrets and variables → Actions)

on:
  push:
    branches: [main]
  workflow_dispatch: # permite dispararlo manualmente desde GitHub

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Instalar dependencias
        run: bun install

      - name: Generar cliente Prisma
        run: bunx prisma generate

      # La IA (Firulais) necesita credenciales Z-AI en el runtime de Vercel.
      # El SDK solo lee archivos .z-ai-config (inexistentes en lambdas), así que
      # inyectamos la config DENTRO del bundle: CI genera src/lib/petservice/
      # zaiConfig.ts desde estos secretos antes de compilar (mismo patrón que
      # demoDb.ts). En el repo el archivo viaja con strings vacíos.
      - name: Inyectar config del LLM (ZAI) en el bundle
        run: |
          cat > src/lib/petservice/zaiConfig.ts <<EOF
          // AUTO-GENERADO por CI desde los secretos ZAI_*. No commitear valores reales.
          export const ZAI_CONFIG = {
            baseUrl: "${ZAI_BASE_URL}",
            apiKey: "${ZAI_API_KEY}",
            token: "${ZAI_TOKEN}",
            publicKey: "${ZAI_PUBLIC_KEY}",
            publicModel: "${ZAI_PUBLIC_MODEL}",
          };
          EOF
        env:
          ZAI_BASE_URL: ${{ secrets.ZAI_BASE_URL }}
          ZAI_API_KEY: ${{ secrets.ZAI_API_KEY }}
          ZAI_TOKEN: ${{ secrets.ZAI_TOKEN }}
          ZAI_PUBLIC_KEY: ${{ secrets.ZAI_PUBLIC_KEY }}
          ZAI_PUBLIC_MODEL: ${{ secrets.ZAI_PUBLIC_MODEL }}

      - name: Pull config de Vercel
        run: bunx vercel pull --yes --environment=production --token=$VERCEL_TOKEN
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Build
        run: bunx vercel build --prod --token=$VERCEL_TOKEN
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Deploy a producción
        run: bunx vercel deploy --prebuilt --prod --token=$VERCEL_TOKEN
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
